name: euler
services:
  dev:
    user: node # Used by the image we'll be using.

    # NOTE: When there's custom Dockerfile, usually it is better to build with
    # `build:` instead of `image:`. The exception is when using Podman instead
    # of Docker. In that case, it is more reliable to build the image manually
    # and use it directly.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: localhost/mcra-euler

    # Mount a temporary in-memory filesystem (tmpfs) at /tmp inside the container,
    # with permissions set to allow read/write, execution, and typical /tmp security settings.
    # This ensures /tmp is fast, isolated, and gets wiped on container restart.
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777

    volumes:
      - ..:/workspaces/euler
    working_dir: /workspaces/euler
    command: sleep infinity
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
